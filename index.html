<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>[전략기획팀] 팀 스킬 카탈로그</title>
<style>
  :root{
    --paper:#EEF2F8; --card:#FFFFFF; --card-2:#F5F8FC;
    --ink:#151C27; --ink-soft:#55616F; --ink-faint:#93A0B0;
    --line:#E3E9F1; --line-strong:#CFDAE7;
    --primary:#2666E0; --primary-bg:#E8F0FD; --primary-line:#BAD3F6;
    --live:#1A8A5A; --live-bg:#DDF1E7; --live-line:#A6DBC2;
    --routine:#585FC7; --routine-bg:#E7E8F8; --routine-line:#C2C4EE;
    --shadow:0 1px 2px rgba(28,40,54,.04),0 8px 22px -14px rgba(28,40,54,.18);
    --font:"Pretendard Variable","Pretendard",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    --mono:"SFMono-Regular","D2Coding",ui-monospace,Menlo,monospace;
  }
  @media (prefers-color-scheme:dark){:root{
    --paper:#12151B; --card:#1B2029; --card-2:#212734;
    --ink:#E9EDF3; --ink-soft:#AAB4C1; --ink-faint:#7C8797;
    --line:#2A313D; --line-strong:#3A4350;
    --primary:#5E9BF2; --primary-bg:#182842; --primary-line:#2E4A72;
    --live:#40C08A; --live-bg:#123027; --live-line:#245043;
    --routine:#9096E8; --routine-bg:#232544; --routine-line:#3C3F68;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -16px rgba(0,0,0,.7);
  }}
  :root[data-theme="dark"]{
    --paper:#12151B; --card:#1B2029; --card-2:#212734;
    --ink:#E9EDF3; --ink-soft:#AAB4C1; --ink-faint:#7C8797;
    --line:#2A313D; --line-strong:#3A4350;
    --primary:#5E9BF2; --primary-bg:#182842; --primary-line:#2E4A72;
    --live:#40C08A; --live-bg:#123027; --live-line:#245043;
    --routine:#9096E8; --routine-bg:#232544; --routine-line:#3C3F68;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -16px rgba(0,0,0,.7);
  }
  :root[data-theme="light"]{
    --paper:#EEF2F8; --card:#FFFFFF; --card-2:#F5F8FC;
    --ink:#151C27; --ink-soft:#55616F; --ink-faint:#93A0B0;
    --line:#E3E9F1; --line-strong:#CFDAE7;
    --primary:#2666E0; --primary-bg:#E8F0FD; --primary-line:#BAD3F6;
    --live:#1A8A5A; --live-bg:#DDF1E7; --live-line:#A6DBC2;
    --routine:#585FC7; --routine-bg:#E7E8F8; --routine-line:#C2C4EE;
    --shadow:0 1px 2px rgba(28,40,54,.04),0 8px 22px -14px rgba(28,40,54,.18);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);line-height:1.55;-webkit-font-smoothing:antialiased;}
  button{font-family:inherit;cursor:pointer;}
  .wrap{max-width:880px;margin:0 auto;padding:0 20px;}
  header.top{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
  .toprow{display:flex;align-items:center;gap:12px;height:58px;}
  .logo{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(140deg,var(--primary),#57a0f0);color:#fff;font-size:15px;flex:none;box-shadow:var(--shadow);}
  .ttl{font-weight:800;font-size:15px;letter-spacing:-.01em;white-space:nowrap;}
  .stamp{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink-faint);white-space:nowrap;font-variant-numeric:tabular-nums;}
  .theme{border:1px solid var(--line);background:var(--card);color:var(--ink-soft);border-radius:9px;width:34px;height:34px;font-size:14px;flex:none;}
  main{padding:24px 0 70px;}
  h1{font-size:clamp(20px,3vw,25px);font-weight:800;letter-spacing:-.02em;margin:0 0 6px;text-wrap:balance;}
  .sub{margin:0;color:var(--ink-soft);font-size:13.5px;}
  .sub b{color:var(--ink);}
  .notice{display:flex;gap:10px;align-items:flex-start;background:var(--primary-bg);border:1px solid var(--primary-line);border-radius:11px;padding:11px 14px;margin:16px 0 20px;font-size:13px;line-height:1.6;}
  .notice b{color:var(--primary);}
  .tools{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:12px;}
  .search{flex:1;min-width:220px;position:relative;}
  .search input{width:100%;border:1px solid var(--line-strong);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 13px 9px 34px;font-size:14px;outline:none;}
  .search input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-bg);}
  .search .si{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-faint);font-size:13px;}
  .filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px;}
  .fbtn{border:1px solid var(--line-strong);background:var(--card);color:var(--ink-soft);font-weight:600;font-size:12.5px;padding:6px 12px;border-radius:999px;transition:.15s;}
  .fbtn.active{background:var(--primary);color:#fff;border-color:var(--primary);}
  .catsec{margin-bottom:24px;}
  .ch{display:flex;align-items:center;gap:8px;margin:0 0 10px;}
  .ch .cico{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:13px;background:var(--card-2);border:1px solid var(--line);}
  .ch h2{margin:0;font-size:15px;font-weight:800;}
  .ch .cnt{font-family:var(--mono);font-size:11.5px;color:var(--ink-faint);font-weight:600;}
  .cards{display:flex;flex-direction:column;gap:8px;}
  .scard{background:var(--card);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);overflow:hidden;transition:border-color .15s;}
  .scard.open{border-color:var(--primary-line);}
  .chead{display:flex;align-items:center;gap:11px;padding:12px 12px 12px 15px;cursor:pointer;}
  .nm{flex:none;font-weight:800;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40%;}
  .sep{flex:none;width:1px;height:12px;background:var(--line-strong);}
  .one{flex:1;min-width:0;font-size:12.5px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  @media (max-width:600px){.chead{flex-wrap:wrap;}.nm{max-width:100%;}.sep{display:none;}.one{width:100%;flex-basis:100%;}}
  .rdot{width:7px;height:7px;border-radius:50%;background:var(--routine);flex:none;}
  .go{border:1px solid var(--primary);background:var(--primary);color:#fff;font-weight:700;font-size:12px;padding:6px 11px;border-radius:8px;white-space:nowrap;flex:none;}
  .tg{border:1px solid var(--line-strong);background:var(--card);color:var(--ink-faint);width:28px;height:28px;border-radius:8px;font-size:10px;display:grid;place-items:center;transition:.18s;flex:none;}
  .scard.open .tg{transform:rotate(180deg);color:var(--primary);border-color:var(--primary-line);}
  .cbody{display:none;border-top:1px solid var(--line);padding:13px 15px;background:var(--card-2);}
  .scard.open .cbody{display:block;}
  .desc{margin:0 0 11px;font-size:13px;line-height:1.65;color:var(--ink);}
  .trigs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:11px;}
  .trig{font-family:var(--mono);font-size:11.5px;background:var(--card);border:1px solid var(--line-strong);border-radius:999px;padding:4px 11px;color:var(--ink-soft);}
  .pillrow{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px;}
  .pill{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;}
  .pill.live{color:var(--live);background:var(--live-bg);border:1px solid var(--live-line);}
  .pill.routine{color:var(--routine);background:var(--routine-bg);border:1px solid var(--routine-line);}
  .meta{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--ink-faint);flex-wrap:wrap;font-variant-numeric:tabular-nums;}
  .meta .av{width:16px;height:16px;border-radius:50%;background:var(--primary);color:#fff;font-size:9px;font-weight:800;display:inline-grid;place-items:center;vertical-align:-3px;margin-right:4px;}
  .empty{text-align:center;padding:50px 20px;color:var(--ink-faint);}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--ink);color:var(--paper);font-weight:700;font-size:13px;padding:11px 17px;border-radius:10px;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:90vw;}
  .toast.show{opacity:1;transform:translateX(-50%);}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>
</head>

(function(){
  const DATA=JSON.parse(document.getElementById("data").textContent);
  const CATS=[{k:"기획팀공통",e:"📋"},{k:"미디어",e:"📡"},{k:"HR",e:"🧑\u200d💼"},{k:"개인",e:"🙋"},{k:"스킬 운영",e:"⚙️"},{k:"테스트·데모",e:"🧪"},{k:"미분류",e:"📦"}];
  let Q="",F="all";
  const $=s=>document.querySelector(s);
  const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const initial=s=>String(s||"?").trim().charAt(0)||"?";
  function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),2800);}
  function card(s){
    const who=s.isNew?["생성","생성자",s.createdAt,s.createdBy]:["수정","수정자",s.updatedAt,s.updatedBy];
    const trigs=(s.t||[]).filter(t=>t&&!/^\s*\(/.test(t));
    return '<div class="scard" data-n="'+esc(s.n)+'">'
      +'<div class="chead" data-act="toggle"><span class="nm">'+esc(s.n)+'</span>'
      +(s.routine?'<span class="rdot" title="루틴(자동 실행)"></span>':'')
      +'<span class="sep"></span><span class="one">'+esc(s.s||s.d||"(설명 없음)")+'</span>'
      +(trigs.length?'<button class="go" data-act="use">▶ 적용</button>':'')
      +'<button class="tg" data-act="toggle">▾</button></div>'
      +'<div class="cbody"><p class="desc">'+esc(s.d||s.s||"(설명 없음)")+'</p>'
      +(trigs.length?'<div class="trigs">'+trigs.map(t=>'<span class="trig">"'+esc(t)+'"</span>').join("")+'</div>':'')
      +'<div class="pillrow"><span class="pill live">🟢 운영중</span>'+(s.routine?'<span class="pill routine">🔁 루틴'+(s.schedule?" · "+esc(s.schedule):"")+'</span>':'')+'</div>'
      +'<div class="meta">'+who[0]+'일 '+esc(who[2])+' · '+who[1]+' <span><span class="av">'+esc(initial(who[3]))+'</span>'+esc(who[3])+'</span></div>'
      +'</div></div>';
  }
  function render(){
    $("#cnt").textContent="· "+DATA.skills.length+"개";
    const ql=Q.trim().toLowerCase();
    const match=s=>(!ql||s.n.toLowerCase().includes(ql)||(s.s||"").toLowerCase().includes(ql)||(s.d||"").toLowerCase().includes(ql))&&(F==="all"||s.c===F);
    let fh='<button class="fbtn'+(F==="all"?" active":"")+'" data-f="all">전체</button>';
    CATS.forEach(c=>{if(DATA.skills.some(s=>s.c===c.k))fh+='<button class="fbtn'+(F===c.k?" active":"")+'" data-f="'+esc(c.k)+'">'+c.e+" "+esc(c.k)+'</button>';});
    $("#filters").innerHTML=fh;
    let h="",any=false;
    CATS.forEach(c=>{const list=DATA.skills.filter(s=>s.c===c.k&&match(s));if(!list.length)return;any=true;
      h+='<section class="catsec"><div class="ch"><span class="cico">'+c.e+'</span><h2>'+esc(c.k)+'</h2><span class="cnt">'+list.length+'</span></div><div class="cards">'+list.map(card).join("")+'</div></section>';});
    $("#list").innerHTML=any?h:'<div class="empty">🔍 결과가 없어요</div>';
  }
  document.addEventListener("click",e=>{
    const f=e.target.closest(".fbtn");if(f){F=f.dataset.f;render();return;}
    const b=e.target.closest("[data-act]");if(!b)return;
    const cardEl=b.closest(".scard");
    if(b.dataset.act==="toggle")cardEl.classList.toggle("open");
    else if(b.dataset.act==="use"){
      const s=DATA.skills.find(x=>x.n===cardEl.dataset.n);
      const trig=(s.t||[]).find(t=>t&&!/^\s*\(/.test(t));
      if(!trig){toast("이 스킬은 자동 실행 루틴이라 트리거 문구가 없어요");return;}
      try{navigator.clipboard&&navigator.clipboard.writeText(trig);}catch(err){}
      try{window.open("https://claude.ai/new?q="+encodeURIComponent(trig),"_blank");}catch(err){}
      toast("'"+trig+"' 복사됨 · 클로드 열림 (안 붙으면 Ctrl+V)");
    }
  });
  $("#q").addEventListener("input",e=>{Q=e.target.value;render();});
  const tb=$("#themeBtn");let theme=localStorage.getItem("catalog.theme")||"";
  function applyTheme(){if(theme)document.documentElement.setAttribute("data-theme",theme);else document.documentElement.removeAttribute("data-theme");}
  applyTheme();
  tb.onclick=()=>{const cur=theme||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");theme=cur==="dark"?"light":"dark";localStorage.setItem("catalog.theme",theme);applyTheme();};
  render();
})();
</script>
</body>
</html>
