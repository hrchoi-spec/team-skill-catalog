<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>[전략기획팀] 업무자동화 스테이션</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --paper:#EEF2F8; --card:#FFFFFF; --card-2:#F5F8FC; --raise:#FFFFFF;
    --ink:#151C27; --ink-soft:#55616F; --ink-faint:#93A0B0; --line:#E3E9F1; --line-strong:#CFDAE7;
    --primary:#2666E0; --primary-bg:#E8F0FD; --primary-line:#BAD3F6;
    --live:#1A8A5A; --live-bg:#DDF1E7; --live-line:#A6DBC2;
    --edit:#BE7810; --edit-bg:#FBEFD5; --edit-line:#EBCB93;
    --del:#CC3B30; --del-bg:#FBE7E4; --del-line:#F0B7B0;
    --routine:#585FC7; --routine-bg:#E7E8F8; --routine-line:#C2C4EE;
    --shadow:0 1px 2px rgba(28,40,54,.04),0 8px 22px -14px rgba(28,40,54,.18);
    --shadow-lg:0 24px 60px -20px rgba(28,40,54,.34);
    --r:13px;
    --font:"Pretendard Variable","Pretendard","Noto Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    --mono:"SFMono-Regular","JetBrains Mono","D2Coding",ui-monospace,Menlo,monospace;
  }
  @media (prefers-color-scheme:dark){:root{
    --paper:#12151B; --card:#1B2029; --card-2:#212734; --raise:#262D3A;
    --ink:#E9EDF3; --ink-soft:#AAB4C1; --ink-faint:#7C8797; --line:#2A313D; --line-strong:#3A4350;
    --primary:#5E9BF2; --primary-bg:#182842; --primary-line:#2E4A72;
    --live:#40C08A; --live-bg:#123027; --live-line:#245043;
    --edit:#E0A44A; --edit-bg:#332811; --edit-line:#5A4527;
    --del:#F0837A; --del-bg:#3A1D1A; --del-line:#5E2E28;
    --routine:#9096E8; --routine-bg:#232544; --routine-line:#3C3F68;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -16px rgba(0,0,0,.7);
    --shadow-lg:0 30px 70px -20px rgba(0,0,0,.8);
  }}
  :root[data-theme="dark"]{
    --paper:#12151B; --card:#1B2029; --card-2:#212734; --raise:#262D3A;
    --ink:#E9EDF3; --ink-soft:#AAB4C1; --ink-faint:#7C8797; --line:#2A313D; --line-strong:#3A4350;
    --primary:#5E9BF2; --primary-bg:#182842; --primary-line:#2E4A72;
    --live:#40C08A; --live-bg:#123027; --live-line:#245043;
    --edit:#E0A44A; --edit-bg:#332811; --edit-line:#5A4527;
    --del:#F0837A; --del-bg:#3A1D1A; --del-line:#5E2E28;
    --routine:#9096E8; --routine-bg:#232544; --routine-line:#3C3F68;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -16px rgba(0,0,0,.7);
    --shadow-lg:0 30px 70px -20px rgba(0,0,0,.8);
  }
  :root[data-theme="light"]{
    --paper:#EEF2F8; --card:#FFFFFF; --card-2:#F5F8FC; --raise:#FFFFFF;
    --ink:#151C27; --ink-soft:#55616F; --ink-faint:#93A0B0; --line:#E3E9F1; --line-strong:#CFDAE7;
    --primary:#2666E0; --primary-bg:#E8F0FD; --primary-line:#BAD3F6;
    --live:#1A8A5A; --live-bg:#DDF1E7; --live-line:#A6DBC2;
    --edit:#BE7810; --edit-bg:#FBEFD5; --edit-line:#EBCB93;
    --del:#CC3B30; --del-bg:#FBE7E4; --del-line:#F0B7B0;
    --routine:#585FC7; --routine-bg:#E7E8F8; --routine-line:#C2C4EE;
    --shadow:0 1px 2px rgba(28,40,54,.04),0 8px 22px -14px rgba(28,40,54,.18);
    --shadow-lg:0 24px 60px -20px rgba(28,40,54,.34);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);line-height:1.55;-webkit-font-smoothing:antialiased;}
  button{font-family:inherit;cursor:pointer;}
  .wrap{max-width:1080px;margin:0 auto;padding:0 22px;}

  .topbar{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--paper) 88%,transparent);
    backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line);}
  .topbar .row{display:flex;align-items:center;gap:16px;height:60px;}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.01em;font-size:15.5px;white-space:nowrap;}
  .brand .logo{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
    background:linear-gradient(140deg,var(--primary),#57a0f0);color:#fff;font-size:15px;box-shadow:var(--shadow);}
  nav.tabs{display:flex;gap:4px;margin-left:6px;flex:1;overflow-x:auto;}
  .tab{border:1px solid transparent;background:transparent;color:var(--ink-soft);font-weight:700;font-size:14px;
    padding:8px 14px;border-radius:10px;display:flex;align-items:center;gap:7px;white-space:nowrap;transition:.15s;}
  .tab:hover{background:var(--card-2);color:var(--ink);}
  .tab.active{background:var(--card);color:var(--primary);border-color:var(--line);box-shadow:var(--shadow);}
  .tab .badge{font-family:var(--mono);font-size:11px;font-weight:700;background:var(--edit);color:#fff;
    border-radius:999px;padding:1px 7px;min-width:18px;text-align:center;}
  .tab .badge.zero{background:var(--line-strong);color:var(--ink-faint);}
  .theme-btn{border:1px solid var(--line);background:var(--card);color:var(--ink-soft);border-radius:9px;
    width:36px;height:36px;font-size:15px;display:grid;place-items:center;flex:none;}

  .view{padding:22px 0 64px;}
  .vhead{margin-bottom:16px;}
  .vhead h1{font-size:clamp(21px,3vw,27px);font-weight:800;letter-spacing:-.02em;margin:0 0 6px;}
  .vhead p{margin:0;color:var(--ink-soft);font-size:14px;max-width:72ch;}
  .vhead p+p{margin-top:3px;}
  .vhead p b{color:var(--ink);}

  .banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--primary-bg);
    border:1px solid var(--primary-line);border-radius:12px;padding:12px 15px;margin-bottom:18px;}
  .banner .bi{font-size:18px;}
  .banner .bt{flex:1;min-width:220px;font-size:13px;color:var(--ink);}
  .banner .bt b{color:var(--primary);}
  .banner input{flex:2;min-width:220px;border:1px solid var(--primary-line);background:var(--card);color:var(--ink);
    border-radius:9px;padding:9px 12px;font-size:13px;font-family:var(--mono);outline:none;}
  .banner button{border:none;background:var(--primary);color:#fff;font-weight:700;font-size:13px;padding:9px 16px;border-radius:9px;}
  .banner.ok{background:var(--live-bg);border-color:var(--live-line);}
  .banner.ok .bt b{color:var(--live);}

  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
  .search{flex:1;min-width:200px;position:relative;}
  .search input{width:100%;border:1px solid var(--line-strong);background:var(--card);color:var(--ink);
    border-radius:11px;padding:10px 14px 10px 36px;font-size:14px;outline:none;}
  .search input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-bg);}
  .search .si{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-faint);font-size:14px;}
  .listtools{display:flex;gap:8px;align-items:center;}
  .lbtn{border:1px solid var(--line-strong);background:var(--card);color:var(--ink-soft);font-weight:600;font-size:12.5px;padding:7px 11px;border-radius:9px;}
  .lbtn:hover{color:var(--ink);}
  .filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px;}
  .fbtn{border:1px solid var(--line-strong);background:var(--card);color:var(--ink-soft);font-weight:600;font-size:12.5px;padding:7px 12px;border-radius:999px;transition:.15s;}
  .fbtn:hover{color:var(--ink);}
  .fbtn.active{background:var(--primary);color:#fff;border-color:var(--primary);}
  .fbtn.routine.active{background:var(--routine);border-color:var(--routine);}

  .catsec{margin-bottom:24px;}
  .catsec>.ch{display:flex;align-items:center;gap:9px;margin:0 0 10px;}
  .catsec .ch .cico{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:13px;background:var(--card-2);border:1px solid var(--line);}
  .catsec .ch h2{margin:0;font-size:15px;font-weight:800;letter-spacing:-.01em;}
  .catsec .ch .cnt{font-family:var(--mono);font-size:11.5px;color:var(--ink-faint);font-weight:600;}
  .cards{display:flex;flex-direction:column;gap:8px;}

  .scard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;transition:border-color .15s,box-shadow .15s;}
  .scard:hover{border-color:var(--line-strong);}
  .scard.open{border-color:var(--primary-line);box-shadow:var(--shadow-lg);}
  .chead{display:flex;align-items:center;gap:12px;padding:13px 12px 13px 16px;cursor:pointer;}
  .ctoggle{flex:1;min-width:0;border:none;background:transparent;text-align:left;display:flex;flex-direction:row;align-items:center;gap:9px;padding:0;color:var(--ink);}
  .ctoggle .nm{flex:none;font-weight:800;font-size:14px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:38%;}
  .ctoggle .dots{flex:none;}
  .ctoggle .sep{flex:none;width:1px;height:12px;background:var(--line-strong);}
  .schtag{flex:none;font-size:10px;font-weight:700;color:var(--routine);background:var(--routine-bg);border:1px solid var(--routine-line);border-radius:999px;padding:1px 7px;white-space:nowrap;}
  .subbtns{display:flex;gap:7px;flex-wrap:wrap;margin:-4px 0 8px;}
  .subbtn{border:1px solid var(--line-strong);background:var(--card-2);color:var(--ink);font-weight:700;font-size:12px;padding:7px 11px;border-radius:8px;display:inline-flex;align-items:center;gap:5px;}
  .subbtn:hover{border-color:var(--primary);color:var(--primary);}
  .subbtn.rt:hover{border-color:var(--routine);color:var(--routine);}
  .ctoggle .one{flex:1;min-width:0;font-size:12.5px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.4;}
  @media (max-width:600px){.ctoggle{flex-direction:column;align-items:flex-start;gap:3px;} .ctoggle .nm{max-width:100%;} .ctoggle .sep{display:none;} .ctoggle .one{width:100%;}}
  .dots{display:flex;gap:4px;flex:none;}
  .dot{width:7px;height:7px;border-radius:50%;}
  .dot.live{background:var(--live);} .dot.routine{background:var(--routine);} .dot.rev{background:var(--edit);} .dot.del{background:var(--del);}
  .chz{display:flex;align-items:center;gap:6px;flex:none;}
  .applybtn{background:var(--primary);color:#fff;border:1px solid var(--primary);font-weight:700;font-size:12.5px;padding:7px 13px;border-radius:9px;white-space:nowrap;display:flex;align-items:center;gap:5px;transition:.15s;}
  .applybtn:hover{filter:brightness(1.07);}
  .tgbtn{border:1px solid var(--line-strong);background:var(--card);color:var(--ink-faint);width:30px;height:30px;border-radius:8px;font-size:11px;display:grid;place-items:center;transition:.18s;flex:none;}
  .tgbtn:hover{color:var(--ink);}
  .scard.open .tgbtn{transform:rotate(180deg);color:var(--primary);border-color:var(--primary-line);}
  .cbody{display:none;border-top:1px solid var(--line);padding:13px 14px;background:var(--card-2);}
  .scard.open .cbody{display:block;}
  .cbody .desc{margin:0 0 11px;color:var(--ink);font-size:13px;line-height:1.62;}
  .rowpills{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px;}
  .pill{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;display:inline-flex;align-items:center;gap:4px;}
  .pill.live{color:var(--live);background:var(--live-bg);border:1px solid var(--live-line);}
  .pill.routine{color:var(--routine);background:var(--routine-bg);border:1px solid var(--routine-line);}
  .pill.rev{color:var(--edit);background:var(--edit-bg);border:1px solid var(--edit-line);}
  .pill.del{color:var(--del);background:var(--del-bg);border:1px solid var(--del-line);}
  .cmeta2{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--ink-faint);font-variant-numeric:tabular-nums;flex-wrap:wrap;margin-bottom:12px;}
  .cmeta2 .tag{font-weight:700;padding:2px 7px;border-radius:999px;font-size:10.5px;}
  .cmeta2 .tag.n{color:var(--primary);background:var(--primary-bg);border:1px solid var(--primary-line);}
  .cmeta2 .tag.e{color:var(--edit);background:var(--edit-bg);border:1px solid var(--edit-line);}
  .cmeta2 .who{margin-left:auto;display:inline-flex;align-items:center;gap:5px;}
  .cmeta2 .who .av{width:16px;height:16px;border-radius:50%;background:var(--primary);color:#fff;font-size:9px;font-weight:800;display:grid;place-items:center;}
  .acts{display:flex;gap:7px;}
  .abtn{flex:1;border:1px solid var(--line-strong);background:var(--card);color:var(--ink);font-weight:700;font-size:12.5px;padding:9px 6px;border-radius:9px;transition:.15s;display:flex;align-items:center;justify-content:center;gap:5px;}
  .abtn:hover{border-color:var(--ink-faint);}
  .abtn.edit{background:var(--edit-bg);color:var(--edit);border-color:var(--edit-line);}
  .abtn.del{background:var(--del-bg);color:var(--del);border-color:var(--del-line);}

  .empty{text-align:center;padding:56px 20px;color:var(--ink-faint);}
  .empty .big{font-size:38px;margin-bottom:10px;}
  .empty h3{margin:0 0 6px;color:var(--ink-soft);font-size:15.5px;}

  .qgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start;}
  @media (max-width:800px){.qgrid{grid-template-columns:1fr;}}
  .qpanel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:15px 15px 13px;}
  .qpanel .rh{margin-bottom:12px;}
  .qpanel .qcard{box-shadow:none;background:var(--card-2);}
  .qempty{border:1.5px dashed var(--line-strong);border-radius:10px;padding:24px 12px;text-align:center;color:var(--ink-faint);font-size:12.5px;line-height:1.6;background:var(--card-2);}
  .qgrid .diff{grid-template-columns:1fr;}
  .rsec{margin-bottom:26px;}
  .rh{display:flex;align-items:center;gap:9px;margin:0 0 12px;}
  .rt{font-weight:800;font-size:14px;padding:5px 13px;border-radius:9px;}
  .rt.edit{color:var(--edit);background:var(--edit-bg);border:1px solid var(--edit-line);}
  .rt.del{color:var(--del);background:var(--del-bg);border:1px solid var(--del-line);}
  .rc{font-family:var(--mono);font-size:12px;color:var(--ink-faint);font-weight:700;}
  .gsec{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 20px;margin-bottom:12px;}
  .gsec h2{margin:0 0 12px;font-size:16px;font-weight:800;display:flex;align-items:center;gap:9px;}
  .gsec .gn{width:24px;height:24px;border-radius:7px;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:12.5px;font-weight:800;flex:none;}
  .gsec p{margin:0;color:var(--ink-soft);font-size:14px;line-height:1.65;}
  .gsec p b,.gsec li b{color:var(--ink);font-weight:700;}
  .gsec ul{margin:2px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px;}
  .gsec li{font-size:13.5px;color:var(--ink-soft);line-height:1.55;display:flex;gap:10px;}
  .gsec li .k{flex:none;font-weight:800;color:var(--primary);min-width:66px;}
  .gbtn{margin-top:14px;background:var(--primary);color:#fff;font-weight:700;font-size:13.5px;padding:9px 16px;border-radius:9px;border:1px solid var(--primary);}
  .gbtn:hover{filter:brightness(1.07);}
  .qcard{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--edit);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 16px 14px;margin-bottom:11px;}
  .qcard.del{border-left-color:var(--del);}
  .qcard .qh{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:11px;}
  .qcard .qh .nm{font-weight:800;font-size:15px;}
  .qcard .qh .qmeta{margin-left:auto;font-size:11.5px;color:var(--ink-faint);font-variant-numeric:tabular-nums;}
  .diff{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:11px;}
  @media (max-width:600px){.diff{grid-template-columns:1fr;}}
  .box{border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--card-2);}
  .box .bh{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:6px 11px;border-bottom:1px solid var(--line);color:var(--ink-faint);}
  .box.after .bh{color:var(--live);}
  .box pre,.codeblk{margin:0;padding:11px;font-family:var(--mono);font-size:11px;line-height:1.5;color:var(--ink-soft);white-space:pre-wrap;word-break:break-word;max-height:210px;overflow:auto;}
  .codeblk{background:var(--card-2);border:1px solid var(--line);border-radius:9px;}
  .qnote{font-size:12.5px;color:var(--ink-soft);background:var(--card-2);border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin-bottom:11px;}
  .qacts{display:flex;gap:7px;flex-wrap:wrap;}
  .btn{border:1px solid var(--line-strong);background:var(--card);color:var(--ink);font-weight:700;font-size:13px;padding:9px 15px;border-radius:9px;transition:.15s;display:inline-flex;align-items:center;gap:6px;}
  .btn:hover{border-color:var(--ink-faint);}
  .btn.ok{background:var(--live);color:#fff;border-color:var(--live);}
  .btn.ok:hover{filter:brightness(1.06);}
  .btn.pri{background:var(--primary);color:#fff;border-color:var(--primary);}
  .btn.del{background:var(--del);color:#fff;border-color:var(--del);}
  .btn.del:hover{filter:brightness(1.06);}
  .btn.danger{color:#c0392b;} :root[data-theme="dark"] .btn.danger{color:#ff8a80;}
  .btn.ghost{background:transparent;}

  .scrim{position:fixed;inset:0;background:rgba(15,22,33,.55);backdrop-filter:blur(3px);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:40px 18px;overflow:auto;opacity:0;pointer-events:none;transition:.18s;}
  .scrim.show{opacity:1;pointer-events:auto;}
  .modal{background:var(--card);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow-lg);width:100%;max-width:620px;transform:translateY(8px) scale(.99);transition:.18s;}
  .scrim.show .modal{transform:none;}
  .modal .mh{display:flex;align-items:center;gap:12px;padding:16px 19px;border-bottom:1px solid var(--line);}
  .modal .mh .nm{font-weight:800;font-size:16px;}
  .modal .mh .x{margin-left:auto;border:none;background:var(--card-2);color:var(--ink-soft);width:31px;height:31px;border-radius:8px;font-size:15px;}
  .modal .mb{padding:19px;}
  .modal .mb p.d{color:var(--ink-soft);font-size:13.5px;line-height:1.6;margin:0 0 14px;}
  .field{margin-bottom:13px;}
  .field label{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin:0 0 6px;letter-spacing:.02em;}
  textarea,input.tin{width:100%;border:1px solid var(--line-strong);background:var(--card-2);color:var(--ink);border-radius:9px;padding:10px 12px;font-size:13.5px;font-family:var(--font);outline:none;}
  textarea.md{font-family:var(--mono);font-size:12px;line-height:1.6;min-height:230px;resize:vertical;}
  textarea:focus,input.tin:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-bg);}
  .mf{display:flex;gap:8px;justify-content:flex-end;padding:15px 19px;border-top:1px solid var(--line);flex-wrap:wrap;}
  .say{display:flex;flex-wrap:wrap;gap:7px;}
  .say .c{font-size:13px;font-weight:700;background:var(--card-2);border:1px solid var(--line-strong);border-radius:999px;padding:6px 12px;display:inline-flex;align-items:center;gap:7px;}
  .say .c .cp{border:none;background:transparent;color:var(--ink-faint);font-size:12px;padding:0;}
  .hintbox{display:flex;gap:9px;background:var(--primary-bg);border:1px solid var(--primary-line);border-radius:10px;padding:11px 13px;font-size:12.5px;color:var(--ink);margin-top:12px;line-height:1.55;}
  .hintbox b{color:var(--primary);}

  .wiz{max-width:680px;margin:0 auto;}
  .prog{display:flex;align-items:center;gap:6px;margin-bottom:20px;}
  .prog .seg{flex:1;height:6px;border-radius:999px;background:var(--line);overflow:hidden;}
  .prog .seg.done{background:var(--primary);}
  .prog .seg.cur{background:linear-gradient(90deg,var(--primary),var(--primary-bg));}

  /* ---- SKILLS ---- */
  function viewSkills(){
    let h='<div class="vhead"><h1>스킬 목록</h1><p>팀 스킬 <b>'+STATE.skills.length+'개</b> · 카드를 누르면 상세 내용을 확인할 수 있어요.</p><p>새 스킬은 바로 배포되고, 수정은 승인 대기함을 거칩니다.</p></div>';
    h+=bannerHtml();
    h+='<div class="toolbar"><div class="search"><span class="si">🔍</span><input id="q" placeholder="스킬 이름·설명 검색" value="'+esc(Q)+'"></div><div class="listtools"><button class="lbtn" id="expandAll">⇕ 전체 펼치기</button></div></div>';
    h+='<div class="filters" id="filters"><button class="fbtn '+(FILTER==="all"?"active":"")+'" data-f="all">전체</button>';
    CATS.forEach(c=>{const n=STATE.skills.filter(s=>s.c===c.key).length;if(n)h+='<button class="fbtn '+(FILTER===c.key?"active":"")+'" data-f="'+esc(c.key)+'">'+c.emoji+" "+esc(c.key)+'</button>';});
    const rc=STATE.skills.filter(s=>s.routine).length;
    if(rc)h+='<button class="fbtn routine '+(FILTER==="__routine"?"active":"")+'" data-f="__routine">🔁 루틴 <span style="opacity:.7">'+rc+'</span></button>';
    h+='</div>';
    const ql=Q.trim().toLowerCase();
    const match=s=>{const catOk=FILTER==="all"?true:(FILTER==="__routine"?!!s.routine:s.c===FILTER);return (!ql||s.n.toLowerCase().includes(ql)||(s.d||"").toLowerCase().includes(ql)||(s.s||"").toLowerCase().includes(ql))&&catOk;};
    let any=false;
    CATS.forEach(cat=>{const list=STATE.skills.filter(s=>s.c===cat.key&&match(s));if(!list.length)return;any=true;
      h+='<section class="catsec"><div class="ch"><span class="cico">'+cat.emoji+'</span><h2>'+esc(cat.key)+'</h2><span class="cnt">'+list.length+'</span></div><div class="cards">';
      list.forEach(s=>h+=skillCard(s));h+='</div></section>';});
    if(!any)h+='<div class="empty"><div class="big">🔍</div><h3>결과가 없어요</h3></div>';
    return h;
  }
  function skillCard(s){
    const pk=pendingKind(s.n),isNew=s.lastKind==="new";
    let dots='<span class="dot live"></span>'+(s.routine?'<span class="dot routine"></span>':'')+(pk==="edit"?'<span class="dot rev"></span>':'')+(pk==="delete"?'<span class="dot del"></span>':'');
    const meta='<span class="tag '+(isNew?"n":"e")+'">'+(isNew?"🆕 생성":"✏️ 수정")+'</span>'+(isNew?"생성일 "+esc(s.createdAt):"수정일 "+esc(s.updatedAt))+
      '<span class="who">'+(isNew?"생성자":"수정자")+' <span class="av">'+esc(initial(isNew?s.createdBy:s.updatedBy))+'</span>'+esc(isNew?s.createdBy:s.updatedBy)+'</span>';
    const pills='<span class="pill live">🟢 운영중</span>'+(s.routine?'<span class="pill routine">🔵 루틴</span>':'')+(pk==="edit"?'<span class="pill rev">🟡 수정 검토중</span>':'')+(pk==="delete"?'<span class="pill del">🔴 삭제 검토중</span>':'');
    const one=(s.s||s.d||"(설명 없음)").replace(/\s+/g," ").trim();
    return '<div class="scard">'+
      '<div class="chead" data-act="toggle">'+
        '<button class="ctoggle" data-act="toggle"><span class="nm">'+esc(s.n)+'</span>'+(s.routine?'<span class="schtag">🔁 루틴</span>':'')+'<span class="dots">'+dots+'</span><span class="sep"></span><span class="one">'+esc(one)+'</span></button>'+
        '<div class="chz"><button class="applybtn" data-act="use" data-n="'+esc(s.n)+'">▶ 적용</button><button class="tgbtn" data-act="toggle">▾</button></div>'+
      '</div>'+
      '<div class="cbody"><p class="desc">'+esc(s.d||s.s||"(설명 없음)")+'</p><div class="rowpills">'+pills+'</div><div class="cmeta2">'+meta+'</div>'+
      '<div class="acts"><button class="abtn edit" data-act="edit" data-n="'+esc(s.n)+'">✏️ 수정하기</button><button class="abtn del" data-act="del" data-n="'+esc(s.n)+'">🗑️ 삭제하기</button></div></div></div>';
  }
  function wireSkills(){
    wireBanner();
    const q=$("#q");if(q)q.oninput=e=>{Q=e.target.value;const p=q.selectionStart;$("#app").innerHTML=viewSkills();wireSkills();const q2=$("#q");if(q2){q2.focus();try{q2.setSelectionRange(p,p);}catch(e){}}};
    const f=$("#filters");if(f)f.onclick=e=>{const b=e.target.closest(".fbtn");if(!b)return;FILTER=b.dataset.f;$("#app").innerHTML=viewSkills();wireSkills();};
    const ea=$("#expandAll");if(ea)ea.onclick=()=>{const cards=document.querySelectorAll(".scard");const anyClosed=[...cards].some(c=>!c.classList.contains("open"));cards.forEach(c=>c.classList.toggle("open",anyClosed));ea.textContent=anyClosed?"⇕ 전체 접기":"⇕ 전체 펼치기";};
    $("#app").onclick=onAppClick;
  }
  function onAppClick(e){
    const b=e.target.closest("[data-act]");if(!b)return;
    const act=b.dataset.act,n=b.dataset.n,id=b.dataset.id;
    if(act==="toggle")b.closest(".scard").classList.toggle("open");
    else if(act==="use")applySkill(n);
    else if(act==="edit")openEdit(n);
    else if(act==="del")openDelete(n);
    else if(act==="approve")doApprove(id);
    else if(act==="reject")doReject(id);
  }

  /* ---- REVIEW ---- */
  function viewReview(){
    const edits=STATE.queue.filter(q=>(q.kind||"edit")==="edit");
    const dels=STATE.queue.filter(q=>q.kind==="delete");
    let h='<div class="vhead"><h1>승인 대기함</h1><p>수정·삭제 요청을 검토·승인하는 곳이에요. 새 스킬은 승인 없이 바로 배포됩니다.</p></div>';
    h+='<div class="qgrid">';
    // 수정 제안
    h+='<section class="qpanel"><div class="rh"><span class="rt edit">✏️ 수정 제안</span><span class="rc">'+edits.length+'건</span></div>';
    if(!edits.length)h+='<div class="qempty">대기 중인 수정 제안이 없어요.<br>스킬 카드의 <b>✏️ 수정하기</b>를 누르면 여기로 모입니다.</div>';
    edits.slice().reverse().forEach(q=>{
      h+='<div class="qcard"><div class="qh"><span class="nm">'+esc(q.skill)+'</span><span class="pill rev">🟡 수정</span><span class="qmeta">✏️ '+esc(q.by)+' · '+esc(q.when)+'</span></div>';
      if(q.reason)h+='<div class="qnote">💬 '+esc(q.reason)+'</div>';
      h+='<div class="diff"><div class="box"><div class="bh">현재</div><pre>'+esc(q.oldMd)+'</pre></div><div class="box after"><div class="bh">수정 제안</div><pre>'+esc(q.newMd)+'</pre></div></div>';
      h+='<div class="qacts"><button class="btn ok" data-act="approve" data-id="'+q.id+'">✅ 승인 · 실제 반영</button><button class="btn danger" data-act="reject" data-id="'+q.id+'">반려</button></div></div>';
    });
    h+='</section>';
    // 삭제 요청
    h+='<section class="qpanel"><div class="rh"><span class="rt del">🗑️ 삭제 요청</span><span class="rc">'+dels.length+'건</span></div>';
    if(!dels.length)h+='<div class="qempty">대기 중인 삭제 요청이 없어요.<br>스킬 카드의 <b>🗑️ 삭제하기</b>를 누르면 여기로 모입니다.</div>';
    dels.slice().reverse().forEach(q=>{
      h+='<div class="qcard del"><div class="qh"><span class="nm">'+esc(q.skill)+'</span><span class="pill del">🗑️ 삭제</span><span class="qmeta">🗑️ '+esc(q.by)+' · '+esc(q.when)+'</span></div>';
      if(q.reason)h+='<div class="qnote">💬 '+esc(q.reason)+'</div>';
      h+='<div class="qnote" style="background:var(--del-bg);border-color:var(--del-line)">⚠️ 승인하면 <b>'+esc(q.skill)+'</b> 스킬 폴더가 실제로 삭제됩니다.</div>';
      h+='<div class="box"><div class="bh">삭제될 스킬</div><pre>'+esc(q.oldMd||"(내용 없음)")+'</pre></div>';
      h+='<div class="qacts" style="margin-top:11px"><button class="btn del" data-act="approve" data-id="'+q.id+'">🗑️ 승인 · 실제 삭제</button><button class="btn danger" data-act="reject" data-id="'+q.id+'">반려</button></div></div>';
    });

  async function doApprove(id){const r=await api("/api/approve",{id:Number(id)});if(!r.ok){toast(r.error||"실패");return;}STATE=r.state;toast("승인 · 파일 반영 완료"+slackMsg(r));render();}
  async function doReject(id){const r=await api("/api/reject",{id:Number(id)});STATE=r.state;toast("반려했어요");render();}

  /* ---- modals ---- */
  function openModal(html){$("#modal").innerHTML=html;$("#scrim").classList.add("show");$("#modal").querySelectorAll("[data-close]").forEach(x=>x.onclick=closeModal);}
  function closeModal(){$("#scrim").classList.remove("show");}
  $("#scrim").addEventListener("click",e=>{if(e.target.id==="scrim")closeModal();});
  document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();});

  function applySkill(n){const s=getSkill(n);if(!s)return;
    const trig=(s.t||[]).find(t=>t&&!/^\s*\(/.test(t));
    if(!trig){toast("이 스킬은 자동 실행 루틴이라 트리거 문구가 없어요");return;}
    try{navigator.clipboard&&navigator.clipboard.writeText(trig);}catch(e){}
    try{window.open("https://claude.ai/new?q="+encodeURIComponent(trig),"_blank");}catch(e){}
    toast("‘"+trig+"’ 복사됨 · 클로드 열림 (안 붙으면 Ctrl+V)");}
  function openEdit(n){const s=getSkill(n);if(!s)return;
    openModal('<div class="mh"><span class="nm">✏️ '+esc(s.n)+' 수정</span><button class="x" data-close>✕</button></div><div class="mb"><p class="d">SKILL.md를 고쳐보세요. <b>저장해도 바로 반영되지 않고</b> 승인 대기함으로 넘어갑니다.</p><div class="field"><label>SKILL.md</label><textarea class="md" id="ed">'+esc(s.md)+'</textarea></div><div class="subbtns"><button class="subbtn" id="sgBtn">🤖 클로드로 제안받기</button><button class="subbtn rt" id="rtBtn">🔁 루틴으로 등록</button></div><div class="field"><label>수정 사유 (선택)</label><input class="tin" id="edReason" placeholder="예: 트리거 문구 추가"></div><div class="field"><label>수정한 사람 (수정자)</label><input class="tin" id="edWho" placeholder="이름을 입력하세요"></div></div><div class="mf"><button class="btn ghost" data-close>취소</button><button class="btn pri" id="edSubmit">📝 승인 대기함으로 보내기</button></div>');
    $("#sgBtn").onclick=()=>openSuggest(s);
    $("#rtBtn").onclick=()=>openRoutine(s);
    $("#edSubmit").onclick=async()=>{const nv=$("#ed").value,who=($("#edWho").value||"").trim()||"익명",reason=($("#edReason").value||"").trim();
      const r=await api("/api/edit",{name:s.n,newMd:nv,by:who,reason:reason});if(!r.ok){toast(r.error||"실패");return;}
      STATE=r.state;closeModal();toast("승인 대기함으로 보냈어요"+slackMsg(r));VIEW="review";render();};}
  function openDelete(n){const s=getSkill(n);if(!s)return;
    openModal('<div class="mh"><span class="nm">🗑️ '+esc(s.n)+' 삭제</span><button class="x" data-close>✕</button></div><div class="mb"><p class="d">이 스킬을 <b>삭제 요청</b>합니다. 바로 삭제되지 않고 <b>승인 대기함</b>으로 넘어가며, 승인 시 실제 파일이 삭제돼요.</p><div class="hintbox" style="background:var(--del-bg);border-color:var(--del-line)">⚠️ <div><b>'+esc(s.n)+'</b> 스킬 폴더가 승인 후 완전히 삭제됩니다.</div></div><div class="field"><label>삭제 사유 (선택)</label><input class="tin" id="delReason" placeholder="예: 더 이상 사용하지 않음"></div><div class="field"><label>요청자</label><input class="tin" id="delWho" placeholder="이름을 입력하세요"></div></div><div class="mf"><button class="btn ghost" data-close>취소</button><button class="btn del" id="delSubmit">🗑️ 삭제 요청 보내기</button></div>');
    $("#delSubmit").onclick=async()=>{const who=($("#delWho").value||"").trim()||"익명",reason=($("#delReason").value||"").trim();
      const r=await api("/api/delete_request",{name:s.n,by:who,reason:reason});if(!r.ok){toast(r.error||"실패");return;}
      STATE=r.state;closeModal();toast("삭제 요청을 승인 대기함으로 보냈어요"+slackMsg(r));VIEW="review";render();};}
  function openSuggest(s){
    openModal('<div class="mh"><span class="nm">🤖 '+esc(s.n)+' — 클로드로 제안받기</span><button class="x" data-close>✕</button></div><div class="mb"><p class="d">고치고 싶은 점만 적으면, 클로드가 SKILL.md 수정안을 만들어줄 <b>프롬프트</b>를 만들어 드려요. 복사 → 클로드에 붙여넣기 → 받은 SKILL.md를 수정칸에 붙여넣으면 끝이에요.</p><div class="field"><label>어떤 점이 불편하거나 바꾸고 싶으세요?</label><textarea id="sgTxt" placeholder="예: 트리거 문구를 더 자연스럽게 / 슬랙 채널을 바꾸고 싶어 / 승인 단계 설명 추가"></textarea></div><div class="hintbox">💡 <div>복사되면 <b>클로드 새 대화</b>가 열려요. 붙여넣고, 답으로 받은 <b>markdown 블록</b>을 통째로 수정칸에 붙여넣으세요.</div></div></div><div class="mf"><button class="btn ghost" data-close>취소</button><button class="btn pri" id="sgGo">📋 프롬프트 복사 & 클로드 열기</button></div>');
    $("#sgGo").onclick=()=>{const c=($("#sgTxt").value||"").trim();if(!c){toast("바꾸고 싶은 점을 적어주세요");return;}
      const p="아래는 우리 팀 자동화 스킬 \'"+s.n+"\'의 현재 SKILL.md야.\n\n[바꾸고 싶은 점]\n"+c+"\n\n이 요청을 반영해 SKILL.md 전체를 개선해줘. frontmatter(name/description/category/summary)는 유지하되 필요한 부분만 고치고, 결과는 하나의 markdown 코드블록으로 전체 SKILL.md만 출력해줘.\n\n[현재 SKILL.md]\n```markdown\n"+s.md+"\n```";
      try{navigator.clipboard&&navigator.clipboard.writeText(p);}catch(e){}
      try{window.open("https://claude.ai/new","_blank");}catch(e){}
      closeModal();toast("프롬프트 복사됨 · 클로드에 붙여넣으세요 (Ctrl+V)");};}
  function openRoutine(s){
    openModal('<div class="mh"><span class="nm">🔁 '+esc(s.n)+' — 루틴 등록</span><button class="x" data-close>✕</button></div><div class="mb"><p class="d">이 스킬을 정해진 주기로 자동 실행되게 등록해요. 등록하면 스킬에 <b>🔁 스케줄</b> 표시가 붙어요.</p><div class="field"><label>실행 주기</label><input class="tin" id="rtFreq" placeholder="예: 매일 오전 9시 / 매주 월 10시 / 30분마다"'+(s.schedule?' value="'+esc(s.schedule)+'"':'')+'><div class="subbtns" id="rtPresets" style="margin-top:8px"><button class="subbtn" data-f="매일 오전 9시">매일 09시</button><button class="subbtn" data-f="매주 월요일 오전 10시">매주 월 10시</button><button class="subbtn" data-f="매월 1일 오전 9시">매월 1일</button><button class="subbtn" data-f="30분마다">30분마다</button><button class="subbtn" data-f="1시간마다">1시간마다</button></div></div><div class="field"><label>등록자</label><input class="tin" id="rtWho" placeholder="이름을 입력하세요"></div><div class="hintbox">📌 <div>발송·결제·디자인 선택처럼 <b>사람 검수가 필요한 작업</b>은 무인 루틴을 권장하지 않아요.</div></div></div><div class="mf"><button class="btn ghost" data-close>취소</button><button class="btn pri" id="rtGo" style="background:var(--routine);border-color:var(--routine)">🔁 루틴 등록</button></div>');
    $("#rtPresets").onclick=e=>{const b=e.target.closest("[data-f]");if(!b)return;$("#rtFreq").value=b.dataset.f;$("#rtFreq").focus();};
    $("#rtGo").onclick=async()=>{const freq=($("#rtFreq").value||"").trim(),who=($("#rtWho").value||"").trim()||"익명";
      if(!freq){toast("실행 주기를 입력해주세요");return;}
      const r=await api("/api/set_routine",{name:s.n,on:true,schedule:freq,by:who});if(!r.ok){toast(r.error||"실패");return;}
      STATE=r.state;toast("루틴 등록됨"+slackMsg(r));render();
      openModal('<div class="mh"><span class="nm">🔁 루틴 등록 완료</span><button class="x" data-close>✕</button></div><div class="mb"><p class="d">대시보드에 <b>🔁 스케줄</b> 표시가 붙었어요. <b>실제 자동 실행</b>까지 걸려면 아래 명령을 클로드에 붙여넣어 최종 등록하세요.</p><div class="codeblk">'+esc(r.cmd||"")+'</div></div><div class="mf"><button class="btn ghost" data-close>닫기</button><button class="btn pri" id="rtCp">📋 명령 복사</button></div>');
      $("#rtCp").onclick=()=>copy(r.cmd||"","명령");};}

  /* ---- WIZARD ---- */
  function mountWizard(app){
    const steps=[
      {key:"cat",title:"어떤 팀 업무인가요?",sub:"스킬이 저장될 카테고리를 골라요.",type:"single",opts:[{v:"기획팀공통",t:"📋 기획팀공통",s:"팀 전체가 함께 쓰는 업무"},{v:"미디어",t:"📡 미디어",s:"매체·광고 운영 업무"},{v:"HR",t:"🧑‍💼 HR",s:"인사·조직 업무"},{v:"개인",t:"🙋 개인",s:"내 개인 반복 업무"}]},
      {key:"desc",title:"무엇을 자동화하고 싶나요?",sub:"구체적으로 적을수록 좋아요.",type:"text",ph:"예: 매주 월요일 지난주 광고 성과를 요약해 슬랙 #보고 채널에 올리고 싶어"},
      {key:"trigger",title:"어떤 말로 부를까요?",sub:"이 스킬을 실행시킬 트리거 문구예요.",type:"text",ph:"예: 주간 성과 요약해줘"},
      {key:"integ",title:"외부 연동이 필요한가요?",sub:"해당되는 걸 모두 골라요.",type:"multi",opts:[{v:"Slack",t:"Slack"},{v:"Gmail",t:"Gmail"},{v:"Drive",t:"Google Drive"},{v:"Sheets",t:"Google Sheets"},{v:"Calendar",t:"Calendar"},{v:"Notion",t:"Notion"},{v:"없음",t:"없음"}]},
      {key:"human",title:"사람이 최종 확인해야 하나요?",sub:"발송·결제·게시 같은 동작은 확인을 권장해요.",type:"single",opts:[{v:"확인 후 진행",t:"🙋 확인 후 진행",s:"실행 전 사람이 승인 (안전)"},{v:"자동 실행",t:"⚙️ 자동 실행",s:"확인 없이 바로 실행"}]},
      {key:"routine",title:"정해진 주기로 자동 실행할까요?",sub:"루틴으로 등록하면 알아서 반복 실행돼요.",type:"single",opts:[{v:"yes",t:"🔁 네, 주기적으로",s:"매일/매주 등 자동 반복"},{v:"no",t:"✋ 아니요, 필요할 때만",s:"내가 직접 부를게요"}]},
      {key:"meta",title:"마지막! 이름과 생성자",sub:"스킬 이름은 영문 kebab-case를 권장해요.",type:"final"}
    ];
    let i=0;const ans={integ:[]};let routineFreq="";
    function draw(){
      const st=steps[i];let h='<div class="wiz"><div class="prog">';
      steps.forEach((_,k)=>h+='<div class="seg '+(k<i?"done":k===i?"cur":"")+'"></div>');
      h+='<span class="lbl">'+(i+1)+" / "+steps.length+'</span></div><div class="wcard"><div class="wstep"><h2>'+esc(st.title)+'</h2><p class="sub">'+esc(st.sub)+'</p>';
      if(st.type==="single"||st.type==="multi"){h+='<div class="opts">';st.opts.forEach(o=>{const sel=st.type==="multi"?ans.integ.includes(o.v):ans[st.key]===o.v;h+='<button class="opt '+(sel?"sel":"")+'" data-v="'+esc(o.v)+'"><div class="ot">'+esc(o.t)+'<span class="chk">✓</span></div>'+(o.s?'<div class="os">'+esc(o.s)+'</div>':'')+'</button>';});h+='</div>';}
      else if(st.type==="text"){h+='<div class="field"><textarea id="wt" placeholder="'+esc(st.ph)+'">'+esc(ans[st.key]||"")+'</textarea></div>';}
      else{h+='<div class="field"><label>스킬 이름</label><input class="tin" id="wname" placeholder="weekly-perf-summary" value="'+esc(ans.name||"")+'"></div><div class="field"><label>생성자 이름</label><input class="tin" id="wowner" placeholder="이름" value="'+esc(ans.owner||"")+'"></div><div class="hintbox">✨ <div><b>거의 다 됐어요!</b> 완료를 누르면 SKILL.md가 만들어져 <b>바로 팀에 배포</b>되고, 스킬 목록에 자동 분류돼 올라가요. (생성일·생성자 기록 + 슬랙 알림)</div></div>';}
      if(ans.human==="확인 후 진행"&&st.key==="routine")h+='<div class="hintbox">🙋 <div><b>확인 후 진행</b>을 고르셨어요. 사람 검수가 필요한 작업은 무인 루틴을 권장하지 않아요.</div></div>';
      if(st.key==="routine"&&ans.routine==="yes")h+='<div class="field" style="margin-top:14px"><label>실행 주기</label><input class="tin" id="wfreq" placeholder="예: 매주 월요일 오전 10시" value="'+esc(routineFreq)+'"></div>';
      h+='</div><div class="wnav"><button class="btn ghost" id="wback"'+(i===0?" disabled style=opacity:.4":"")+'>← 이전</button><button class="btn pri" id="wnext">'+(i===steps.length-1?"✨ 완료 · 바로 배포":"다음 →")+'</button></div></div></div>';
      app.innerHTML=h;
      app.querySelectorAll(".opt").forEach(o=>o.onclick=()=>{const v=o.dataset.v;
        if(st.type==="multi"){if(v==="없음")ans.integ=["없음"];else{ans.integ=ans.integ.filter(x=>x!=="없음");const k=ans.integ.indexOf(v);k>=0?ans.integ.splice(k,1):ans.integ.push(v);}draw();}
        else{ans[st.key]=v;if(st.key==="routine"||st.key==="human")draw();else next();}});
      const fq=$("#wfreq");if(fq)fq.oninput=e=>routineFreq=e.target.value;
      $("#wback").onclick=()=>{if(i>0){i--;draw();}};$("#wnext").onclick=next;
    }
    function next(){const st=steps[i];
      if(st.type==="text"){const v=($("#wt").value||"").trim();if(!v){toast("내용을 입력해주세요");return;}ans[st.key]=v;}
      if(st.type==="single"&&!ans[st.key]){toast("하나를 선택해주세요");return;}
      if(st.type==="multi"&&!ans.integ.length){toast("하나 이상 선택 (없으면 '없음')");return;}
      if(st.type==="final"){ans.name=($("#wname").value||"").trim();ans.owner=($("#wowner").value||"").trim();if(!ans.name){toast("스킬 이름을 입력해주세요");return;}if(!ans.owner){toast("생성자 이름을 입력해주세요");return;}finish();return;}
      if(i<steps.length-1){i++;draw();}}
    async function finish(){
      const integ=ans.integ.filter(x=>x!=="없음");
      const summary=((ans.desc.replace(/\s+/g," ").trim().split(/(?<=[.!?다요])\s/)[0])||ans.desc).slice(0,60);
      const md="---\nname: "+ans.name+"\ndescription: "+ans.desc+' 트리거: "'+ans.trigger+'".\nsummary: '+summary+"\ncategory: "+ans.cat+"\n---\n\n## 트리거\n- \""+ans.trigger+"\"\n\n## 동작\n"+ans.desc+"\n\n"+(integ.length?"## 연동\n"+integ.map(x=>"- "+x).join("\n")+"\n\n":"")+"## 사람 확인\n"+ans.human+"\n"+(ans.routine==="yes"?"\n## 루틴\n"+(routineFreq||"(주기 미지정)")+"\n":"");
      const r=await api("/api/create",{name:ans.name,category:ans.cat,description:ans.desc,triggers:[ans.trigger],md:md,author:ans.owner});
      if(!r.ok){toast(r.error||"실패");return;}
      STATE=r.state;
      app.innerHTML='<div class="wiz"><div class="wcard"><div class="wstep"><h2>🎉 배포 완료!</h2><p class="sub"><b>'+esc(ans.name)+'</b> 스킬이 만들어져 <b>'+esc(ans.cat)+'</b>에 바로 올라갔어요.'+(r.slack&&r.slack.sent?" 슬랙 알림도 전송됐어요.":"")+'</p><div class="field"><label>생성된 SKILL.md</label><div class="codeblk">'+esc(md)+'</div></div><div class="hintbox">📌 <div>스킬 목록에서 확인할 수 있어요. 새 대화에서 트리거 문구를 말하면 바로 실행됩니다.</div></div><div class="wnav"><button class="btn ghost" id="again">＋ 새 스킬 또 만들기</button><button class="btn pri" id="go">📚 스킬 목록 보기</button></div></div></div></div>';
      $("#again").onclick=()=>{VIEW="create";render();};$("#go").onclick=()=>{VIEW="skills";render();};
      toast("스킬 생성·배포 완료"+slackMsg(r));
    }
    draw();
  }

  /* ---- nav + theme ---- */
  $("#tabs").addEventListener("click",e=>{const t=e.target.closest(".tab");if(!t)return;VIEW=t.dataset.view;render();});
  const tb=$("#themeBtn");let theme=localStorage.getItem("station.theme")||"";
  function applyTheme(){if(theme)document.documentElement.setAttribute("data-theme",theme);else document.documentElement.removeAttribute("data-theme");}
  applyTheme();
  tb.onclick=()=>{const cur=theme||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");theme=cur==="dark"?"light":"dark";localStorage.setItem("station.theme",theme);applyTheme();};

  refresh();
})();
</script>
</body>
</html>
